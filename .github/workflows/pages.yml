name: Deploy UI to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "sologger-ui/**"
      - "sologger-log-transformer-wasm/**"
      - "sologger-log-context/**"
      - "sologger-idl-decoder/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish so the site
# never serves a half-published artifact.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build the WASM transformer from current source so the published site
      # can never ship a stale parser, regardless of what is committed under
      # sologger-ui/public/.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack
      - name: Build WASM transformer
        run: wasm-pack build --target web -- --locked
        working-directory: sologger-log-transformer-wasm
      - name: Sync fresh WASM package into the UI
        run: |
          rm -rf sologger-ui/public/sologger-log-transformer-wasm/pkg
          mkdir -p sologger-ui/public/sologger-log-transformer-wasm
          cp -r sologger-log-transformer-wasm/pkg sologger-ui/public/sologger-log-transformer-wasm/pkg
          rm -f sologger-ui/public/sologger-log-transformer-wasm/pkg/.gitignore \
                sologger-ui/public/sologger-log-transformer-wasm/pkg/README.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sologger-ui/package-lock.json
      - run: npm ci
        working-directory: sologger-ui
      - run: npx vitest run
        working-directory: sologger-ui
      - run: npm run build
        working-directory: sologger-ui

      # The only place the browser suite runs against WASM built from current source
      - run: npx playwright install --with-deps chromium
        working-directory: sologger-ui
      - run: npm run test:e2e
        working-directory: sologger-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: sologger-ui/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sologger-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
