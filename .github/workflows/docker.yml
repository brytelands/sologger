name: Docker Publish

# Builds and pushes the two transport images to Docker Hub. Manual trigger:
# Actions tab -> Docker Publish -> Run workflow.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - the Docker Hub account (brytelands)
#   DOCKERHUB_TOKEN    - a Docker Hub access token with Read & Write scope
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile-logstash
            image: brytelands/sologger-logstash
          - dockerfile: Dockerfile-otel
            image: brytelands/sologger-otel
    steps:
      - uses: actions/checkout@v4

      # Tag images with the sologger binary version alongside latest
      - name: Read sologger version
        id: version
        run: echo "version=$(grep '^version' sologger/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.version.outputs.version }}
