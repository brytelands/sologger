name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catches advisories published between dep changes
  push:
    branches: [ "main" ]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Fails on vulnerabilities; unmaintained/unsound/yanked advisories are
      # reported as warnings and do not fail the job.
      - run: cargo audit
