name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catches advisories published between dep changes
  push:
    branches: [ "main" ]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - "sologger-ui/package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [ "main", "v*" ]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - "sologger-ui/package-lock.json"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Fails on vulnerabilities; unmaintained/unsound/yanked advisories are
      # reported as warnings and do not fail the job.
      - run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sologger-ui
    steps:
      - uses: actions/checkout@v7
      # Covers what ships in the UI. High-severity findings currently include packages with
      # no fix available (via @coral-xyz/anchor), so only critical ones fail the job.
      - run: npm audit --omit=dev --audit-level=critical
