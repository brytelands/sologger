name: UI

on:
  push:
    branches: [ "main", "v*" ]
    paths:
      - "sologger-ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [ "main", "v*" ]
    paths:
      - "sologger-ui/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sologger-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sologger-ui/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: sologger-ui/test-results
          retention-days: 7
