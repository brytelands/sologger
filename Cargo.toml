[workspace]
resolver = "2"

members = [
    "sologger-log-context",
    "sologger-idl-decoder",
    "sologger-log-transport",
    "sologger-log-transformer",
    "sologger-log-transformer-wasm",
    "sologger"
]

# Minimum supported Rust version, inherited by every member via
# `rust-version.workspace = true`. Keep in sync with ARG RUST_VERSION in
# Dockerfile-logstash / Dockerfile-otel; enforced by the `msrv` job in CI.
[workspace.package]
rust-version = "1.92.0"

# Workspace members depend on each other with `{ version = "...", path = "..." }`:
# local builds use the sibling source, and `cargo publish` strips the path and keeps
# the version. The path also tells cargo (and release-plz) the dependency order, so
# the crates publish leaves-first. Releases are automated: see release-plz.toml.