[workspace]
resolver = "2"

members = [
    "sologger-log-context",
    "sologger-log-transport",
    "sologger-log-transformer",
    "sologger-log-transformer-wasm",
    "sologger"
]

# Minimum supported Rust version, inherited by every member via
# `rust-version.workspace = true`. Keep in sync with ARG RUST_VERSION in
# Dockerfile-logstash / Dockerfile-otel; enforced by the `msrv` job in CI.
[workspace.package]
rust-version = "1.92.0"

# Workspace members declare their dependencies on each other by published
# version (so the manifests publish cleanly), but this patch redirects those
# requirements to the local source, so builds and tests exercise the code in
# this repo rather than the crates.io copies. Patches are not included in
# published packages, so `cargo publish` is unaffected.
[patch.crates-io]
sologger_log_context = { path = "sologger-log-context" }
sologger_log_transformer = { path = "sologger-log-transformer" }
sologger_log_transport = { path = "sologger-log-transport" }