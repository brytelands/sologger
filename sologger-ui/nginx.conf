server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects, so they work whatever host port the container is published on
    absolute_redirect off;

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;

    location = / {
        return 302 /sologger/;
    }

    # Vite emits content-hashed file names here, so they can be cached for good
    location /sologger/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/sologger/lookup?sig=..., /sologger/convert) fall back to the app
    location /sologger/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /sologger/index.html;
    }
}
